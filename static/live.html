<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 Live</title>
<style>
  /* ---- design tokens (M15a) ------------------------------------------------
   * Dark-first, one accent colour, everything as CSS custom properties so a
   * light theme is only a variable swap. body[data-state] carries the current
   * conversation state; the orb colours themselves come from live_core.js.
   */
  :root {
    color-scheme: dark;
    --bg: #05070b;
    --surface: #0c111a;
    --surface-2: #131a26;
    --line: #1d2634;
    --fg: #e8edf5;
    --muted: #9aa6b8;
    --accent: #7dd3fc;
    --accent-ink: #06121f;
    --accent-dim: rgba(125, 211, 252, .16);
    --ok: #6ee7b7;
    --warn: #fcd34d;
    --danger: #fca5a5;
    --radius: 14px;
    --radius-s: 9px;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  /* the stage (orb canvas) always paints deep space, so the page stays dark
   * in both themes: no white panels next to a black stage. */
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: dark;
      --bg: #05070b;
      --surface: #0c111a;
      --surface-2: #131a26;
      --line: #1d2634;
      --fg: #e8edf5;
      --muted: #9aa6b8;
      --accent: #7dd3fc;
      --accent-ink: #06121f;
      --accent-dim: rgba(125, 211, 252, .16);
      --ok: #6ee7b7;
      --warn: #fcd34d;
      --danger: #fca5a5;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 15px/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* ---- layout: stage (orb + captions) / work (side panel) / dock ---------- */
  #app {
    display: grid; height: 100dvh;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr) 340px;
    grid-template-areas: "status work" "stage work" "dock work";
  }
  #status {
    grid-area: status; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  #status .dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--muted);
    transition: background .3s ease;
  }
  body[data-state="ready"] #status .dot { background: var(--accent); }
  body[data-state="listening"] #status .dot { background: var(--ok); }
  body[data-state="thinking"] #status .dot { background: var(--warn); }
  body[data-state="speaking"] #status .dot { background: var(--ok); }
  body[data-state="muted"] #status .dot { background: var(--muted); }
  body[data-state="paused"] #status .dot { background: var(--warn); }
  body[data-state="reconnecting"] #status .dot { background: var(--warn); }
  body[data-state="error"] #status .dot { background: var(--danger); }
  #brain { font-weight: 600; color: var(--fg); }
  #jobs-count { color: var(--muted); }
  #level {
    flex: none; display: block; width: 90px; height: 4px; border-radius: 2px;
    background: var(--line); overflow: hidden; position: relative;
  }
  #level i {
    position: absolute; inset: 0; border-radius: 2px; background: var(--accent);
    transform: scaleX(0); transform-origin: left center;
    transition: transform 90ms linear;
  }
  #status .spacer { flex: 1; }
  #mode {
    display: none; letter-spacing: .14em; text-transform: uppercase;
    font-size: 10px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--warn); color: var(--warn);
    background: var(--surface-2);
  }
  #mode.offline { display: inline-block; }

  #stage {
    grid-area: stage; position: relative; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #orb { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  /* HUD pinned to the lower third of the stage; the orb core (centre) stays clear */
  #hud {
    position: absolute; z-index: 2; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; gap: 12px; padding: 0 0 18px;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }

  /* state word: large, calm, coloured per body[data-state]; sits below the core */
  #state {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; color: var(--muted);
    transition: color .3s ease;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .85);
  }
  #state::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); transition: background .3s ease;
  }
  body[data-state="ready"] #state { color: var(--accent); }
  body[data-state="ready"] #state::before { background: var(--accent); }
  body[data-state="listening"] #state { color: var(--ok); }
  body[data-state="listening"] #state::before { background: var(--ok); }
  body[data-state="thinking"] #state { color: var(--warn); }
  body[data-state="thinking"] #state::before { background: var(--warn); }
  body[data-state="speaking"] #state { color: var(--ok); }
  body[data-state="speaking"] #state::before { background: var(--ok); }
  body[data-state="muted"] #state { color: var(--muted); }
  body[data-state="paused"] #state { color: var(--warn); }
  body[data-state="paused"] #state::before { background: var(--warn); }
  body[data-state="reconnecting"] #state { color: var(--warn); }
  body[data-state="reconnecting"] #state::before { background: var(--warn); }
  body[data-state="error"] #state { color: var(--danger); }
  body[data-state="error"] #state::before { background: var(--danger); }

  /* captions: the conversation, readable at a glance — a very subtle strip
   * pinned below the orb core; invisible while empty so the orb stays clear */
  #captions {
    width: min(640px, calc(100vw - 40px)); max-height: calc(6.5 * 1.6em);
    overflow-y: auto; padding: 14px 18px; border-radius: var(--radius);
    background: rgba(0, 0, 0, .10); border: none;
    font-size: 16.5px; scrollbar-width: thin;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .9);
  }
  #captions:empty { display: none; }
  #captions .line { margin: 3px 0; }
  #captions .line.you { color: var(--accent); }
  #captions .line.seven { color: var(--fg); }
  #captions .who {
    font-weight: 600; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); margin-right: .5em;
  }

  /* dock: the bottom bar of primary actions */
  #dock {
    grid-area: dock; display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 12px 18px;
    border-top: 1px solid var(--line); background: var(--surface);
  }
  #composer {
    display: flex; gap: 8px; flex: 0 1 560px; min-width: 0;
  }
  #say {
    flex: 1; min-width: 0; padding: 10px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--fg); font: inherit; outline: none;
  }
  #say::placeholder { color: var(--muted); }
  #say:focus { border-color: var(--accent); }
  .dbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 40px; padding: 9px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--fg); font: 600 13px var(--font);
    transition: background .2s ease, border-color .2s ease, transform .1s ease;
  }
  .dbtn:hover { background: var(--accent-dim); border-color: var(--accent); }
  .dbtn:active { transform: scale(.97); }
  .dbtn svg { width: 16px; height: 16px; flex: none; }
  #mute.muted, .vbtn.on {
    background: rgba(220, 60, 60, .18); border-color: var(--danger);
    color: var(--danger);
  }

  /* settings panel: form widgets live here, never loose in the dock */
  #settings-panel {
    display: none; position: fixed; right: 16px; bottom: 70px; z-index: 12;
    width: min(320px, calc(100vw - 32px));
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
  }
  #settings-panel.open { display: block; }
  #settings-panel h3 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  #settings-panel label {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 7px 0; font-size: 13.5px; color: var(--fg);
  }
  #settings-panel label + label { border-top: 1px solid var(--line); }
  #voice, #orb-style {
    background: var(--surface-2); color: var(--fg); font: inherit;
    border: 1px solid var(--line); border-radius: var(--radius-s); padding: 5px 8px;
  }
  #music-vol { width: 110px; accent-color: var(--accent); }
  #music, #cues, #starfield { accent-color: var(--accent); width: 16px; height: 16px; }

  /* work: side panel with the jobs timeline and approval cards */
  #work {
    grid-area: work; display: flex; flex-direction: column; min-height: 0;
    background: var(--surface); border-left: 1px solid var(--line);
  }
  #work > h2 {
    margin: 0; padding: 14px 18px 10px;
    font-size: 12px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  #jobs {
    flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
    display: flex; flex-direction: column; gap: 8px; padding: 12px 14px;
  }
  #jobs:empty::after {
    content: "Nothing running. Jobs 7 works on will appear here.";
    color: var(--muted); font-size: 13px; padding: 8px 4px;
  }
  .job-card {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius-s); padding: 10px 12px; cursor: pointer;
    font-size: 13px;
  }
  .job-card .j-task { font-weight: 600; color: var(--fg); }
  .job-card .j-meta {
    color: var(--muted); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .job-card.running { border-left: 2px solid var(--warn); }
  .job-card.running .j-meta { color: var(--warn); }
  .job-card.done { border-left: 2px solid var(--ok); }
  .job-card.done .j-meta { color: var(--ok); }
  .job-card.failed { border-left: 2px solid var(--danger); }
  .job-card.failed .j-meta { color: var(--danger); }
  .job-card .j-reply {
    display: none; margin-top: 8px; color: var(--fg); white-space: pre-wrap;
    max-height: 12em; overflow-y: auto; font-size: 12.5px;
    border-top: 1px solid var(--line); padding-top: 8px;
  }
  .job-card.open .j-reply { display: block; }
  #approvals {
    flex: none; max-height: 45%; overflow-y: auto; scrollbar-width: thin;
    display: flex; flex-direction: column; gap: 8px; padding: 12px 14px;
    border-top: 1px solid var(--line);
  }
  #approvals:empty { display: none; }
  .approval-card {
    background: var(--surface-2);
    border: 1px solid var(--warn); border-radius: var(--radius-s);
    padding: 12px 14px;
  }
  .approval-card .a-title { font-weight: 600; color: var(--warn); margin-bottom: 4px; }
  .approval-card .a-risk {
    display: inline-block; font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
    margin-bottom: 8px; border: 1px solid var(--warn); color: var(--warn);
  }
  .approval-card .a-payload {
    font: 12px var(--mono); color: var(--muted); word-break: break-all;
    max-height: 5.5em; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap;
  }
  .approval-card .a-buttons { display: flex; gap: 8px; }
  .approval-card button {
    flex: 1; padding: 8px 0; border-radius: 999px; cursor: pointer;
    font: 600 13px var(--font); border: 1px solid var(--line);
  }
  .approval-card .a-yes {
    background: rgba(16, 120, 80, .28); color: var(--ok);
    border-color: var(--ok);
  }
  .approval-card .a-no {
    background: rgba(180, 40, 40, .22); color: var(--danger);
    border-color: var(--danger);
  }

  #work-toggle { display: none; }

  /* news panels (M16): 7's own screen, inside the work panel above the jobs */
  #news, #news-live {
    flex: none; display: none; flex-direction: column; gap: 6px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    max-height: 45%; overflow-y: auto; scrollbar-width: thin;
  }
  #news.on, #news-live.on { display: flex; }
  #news h3, #news-live h3 {
    margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  #news ul { list-style: none; margin: 0; padding: 0; }
  #news li { margin: 0; padding: 5px 0; font-size: 13px; line-height: 1.4; }
  #news li + li { border-top: 1px solid var(--line); }
  #news a { color: var(--fg); text-decoration: none; }
  #news a:hover { color: var(--accent); text-decoration: underline; }
  #news .news-meta {
    display: block; color: var(--muted); font-size: 10.5px;
    letter-spacing: .06em; margin-top: 1px;
  }
  #news-live iframe {
    display: block; width: 100%; aspect-ratio: 16 / 9; height: auto;
    border: 1px solid var(--line); border-radius: var(--radius-s);
    background: var(--surface-2);
  }

  /* overlays and badges */
  #vision-badge {
    display: none; position: fixed; top: 52px; left: 16px; z-index: 9;
    padding: 5px 14px; border-radius: 999px; font: 600 12px/1.4 var(--font);
    letter-spacing: .06em; color: var(--danger);
    background: var(--surface); border: 1px solid var(--danger);
    animation: vision-pulse 1.6s ease-in-out infinite;
  }
  #vision-badge.on { display: inline-block; }
  @keyframes vision-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  #drop {
    display: inline-flex; align-items: center; gap: 7px;
  }
  #drop.over { border-color: var(--accent); color: var(--accent); }

  #drop-overlay {
    display: none; position: fixed; inset: 0; z-index: 20;
    align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    border: 2px dashed var(--accent); border-radius: 0;
  }
  #drop-overlay.show { display: flex; }
  #drop-overlay .drop-inner {
    text-align: center; color: var(--accent);
    font-size: 17px; font-weight: 600; pointer-events: none;
  }
  #drop-overlay .drop-inner svg {
    width: 44px; height: 44px; display: block; margin: 0 auto 10px;
  }
  #drop-overlay .drop-sub {
    display: block; margin-top: 4px; font-size: 12.5px;
    font-weight: 400; color: var(--muted);
  }

  #resume {
    display: none; position: fixed; bottom: 76px; left: 50%;
    transform: translateX(-50%); z-index: 9;
    padding: 10px 26px; border-radius: 999px; cursor: pointer;
    font: 600 14px var(--font); color: var(--warn);
    background: var(--surface); border: 1px solid var(--warn);
  }
  #resume.on { display: inline-block; }

  /* pre-Start: no card — the Start button floats on the orb itself */
  #overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    background: transparent;
    pointer-events: none;
  }
  #overlay.hidden { display: none; }
  #overlay button {
    font: 600 17px var(--font); padding: 15px 46px; border: 0;
    border-radius: 999px; color: var(--accent-ink);
    background: var(--accent); cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 0 36px rgba(125, 211, 252, .45);
    transition: transform .15s ease, opacity .2s ease;
  }
  #overlay button:hover { transform: scale(1.03); }
  #overlay button:active { transform: scale(.97); }
  #overlay .overlay-hint {
    font-size: 13px; color: var(--muted); pointer-events: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .9);
  }

  #debug {
    display: none; position: fixed; left: 8px; bottom: 6px; z-index: 5;
    font: 11px var(--mono); color: var(--muted);
  }

  /* ---- mobile: work panel becomes a drawer, orb stays visible ------------- */
  @media (max-width: 700px) {
    #app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "status" "stage" "dock";
    }
    #work {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 15;
      width: min(320px, 86vw);
      visibility: hidden;
      transform: translateX(105%);
      transition: none;
      box-shadow: -12px 0 40px rgba(0, 0, 0, .35);
    }
    #work.open {
      visibility: visible;
      transform: translateX(0);
      transition: none;                    /* open instantly: the panel is there NOW */
    }
    #work:not(.open) {
      transition: transform .28s cubic-bezier(.32, .72, .24, 1), visibility 0s linear .28s;
    }
    #work-toggle { display: inline-flex; }
    #captions { font-size: 15px; width: calc(100vw - 32px); }
    /* one compact row: icon-only buttons (labels via aria-label), composer flexible */
    #dock { flex-wrap: nowrap; gap: 6px; padding: 8px 10px; }
    #composer { flex: 1 1 auto; min-width: 0; }
    #say { padding: 8px 12px; }
    .dbtn { min-height: 36px; padding: 8px 10px; }
    .dbtn span { display: none; }
    #settings-panel { right: 8px; bottom: 118px; }
  }
</style>
</head>
<body data-state="ready">
<div id="app">
  <header id="status">
    <span class="dot" aria-hidden="true"></span>
    <span id="brain">Gemini Live</span>
    <span id="level" aria-hidden="true"><i></i></span>
    <span class="spacer"></span>
    <span id="jobs-count"></span>
    <span id="mode">offline</span>
  </header>

  <main id="stage">
    <canvas id="orb"></canvas>
    <div id="hud">
      <div id="state">Ready — tap Start to talk</div>
      <div id="captions" aria-live="polite"></div>
    </div>
  </main>

  <aside id="work" aria-label="Work">
    <h2>Work</h2>
    <div id="news" hidden></div>
    <div id="news-live" hidden></div>
    <div id="jobs"></div>
    <div id="approvals"></div>
  </aside>

  <footer id="dock">
    <div id="composer">
      <input id="say" type="text" placeholder="Type to 7 — Enter to send" autocomplete="off">
      <button id="mute" class="dbtn" type="button" aria-label="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
        <span id="mute-label">Mute</span>
      </button>
    </div>
    <button id="drop" class="dbtn" type="button" aria-label="Share a file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
      <span>File</span>
    </button>
    <button id="share-screen" class="dbtn vbtn" type="button" aria-label="Share screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Screen</span>
    </button>
    <button id="share-camera" class="dbtn vbtn" type="button" aria-label="Share camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span>Camera</span>
    </button>
    <button id="work-toggle" class="dbtn" type="button" aria-expanded="false" aria-controls="work" aria-label="Work panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
      <span>Work</span>
    </button>
    <button id="settings" class="dbtn" type="button" aria-expanded="false" aria-controls="settings-panel" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.2"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2.2"/></svg>
    </button>
  </footer>
</div>

<div id="settings-panel" role="group" aria-label="Settings">
  <h3>Settings</h3>
  <label>Voice
    <select id="voice">
      <option value="Charon">Charon</option>
      <option value="Puck">Puck</option>
      <option value="Kore">Kore</option>
      <option value="Fenrir">Fenrir</option>
      <option value="Aoede">Aoede</option>
      <option value="Orus">Orus</option>
      <option value="Iapetus">Iapetus</option>

<script>
"use strict";
/* 7 Live page: mic -> PCM16 16 kHz -> ws /live -> Gemini; PCM16 24 kHz -> speaker.
 * Visuals: "universe" orb (canvas), sentence captions, mute, text input. */

        mergeCaption, endTurn, orbParams, duckVolume, cueFor } = liveCore;

const MIC_RATE = 16000;        // up:   PCM16 mono 16 kHz
const SPEAKER_RATE = 24000;    // down: PCM16 mono 24 kHz
const FRAME_MS = 100;          // ~100 ms binary frames up
const MAX_PARTICLES = 128;     // >= the most orbParams() will ever request

const workToggle = document.getElementById("work-toggle");

let ws = null;
let playCtx = null;
let micCtx = null;
let playTime = 0;
let micStarted = false;
let muted = false;
let prevState = "idle";
let curState = "idle";
let lines = [];                // caption model: [{who, text, open}]
let userSpeaking = false;      // mic level above threshold -> duck the music
let paused = false;            // M13 assistant_pause: mic frames are dropped
let pauseTimer = null;         // auto-resume after the requested minutes

/* ---- persistence: everything under "seven_" keys, localStorage may fail --- */
function saveSetting(key, value) {
  try { localStorage.setItem("seven_" + key, String(value)); } catch (_) {}
}
function loadSetting(key, fallback) {
  try {
    const v = localStorage.getItem("seven_" + key);
    return v === null ? fallback : v;
  } catch (_) { return fallback; }
}
function hasConsent() {
  try { return localStorage.getItem("seven_consent") === "1"; } catch (_) { return false; }
}

/* ---- audio levels (drive the orb's breathing and the mic meter) ---------- */
let micAnalyser = null, playAnalyser = null;
let micBuf = null, playBuf = null;
let micLevel = 0, playLevel = 0;

function readLevel(analyser, buf) {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
  return Math.min(1, Math.sqrt(sum / buf.length) * 3.2);
}

/* ---- M19: three-band audio (low / mid / high) -----------------------------
 * window.__bands = [low, mid, high], each 0..1, read every frame with
 * getByteFrequencyData from the analyser of whatever is sounding (7's
 * playback while it speaks, else the mic). Bands ease toward their target
 * (fast attack, soft decay to 0 in silence). window.__setBands(arr, ms)
 * forces targets for ms milliseconds (test hook).
 */
let micFreqBuf = null, playFreqBuf = null;
const bandT = [0, 0, 0];
window.__bands = [0, 0, 0];
let bandHoldUntil = 0;

window.__setBands = function (arr, ms) {
  for (let i = 0; i < 3; i++) {
    bandT[i] = Math.max(0, Math.min(1, Number(arr && arr[i]) || 0));
  }
  bandHoldUntil = performance.now() + (Number(ms) || 0);
};

function bandsStep(dt, nowMs) {
  if (nowMs >= bandHoldUntil) {
    /* pick the analyser that is sounding: playback while 7 speaks, else mic */
    const an = (curState === "speaking" && playAnalyser) ? playAnalyser : micAnalyser;
    if (an) {
      let fb;
      if (an === playAnalyser) {
        fb = playFreqBuf || (playFreqBuf = new Uint8Array(an.frequencyBinCount));
      } else {
        fb = micFreqBuf || (micFreqBuf = new Uint8Array(an.frequencyBinCount));
      }
      an.getByteFrequencyData(fb);
      const n = fb.length;
      const third = Math.max(1, Math.floor(n / 3));
      for (let b = 0; b < 3; b++) {
        let sum = 0;
        const lo = b === 2 ? third * 2 : third * b;
        const hi = b === 2 ? n : lo + third;
        for (let i = lo; i < hi; i++) sum += fb[i];
        bandT[b] = sum / ((hi - lo) * 255);
      }
    } else {
      bandT[0] = bandT[1] = bandT[2] = 0;
    }
  }
  const k = Math.min(1, dt * 10);                 // fast attack, soft decay
  for (let i = 0; i < 3; i++) window.__bands[i] += (bandT[i] - window.__bands[i]) * k;
}

/* ---- state + captions ------------------------------------------------------
 * The websocket speaks in internal states (idle, executing, ...). The UI
 * shows truthful labels via labelFor(): before Start the page says "ready",
 * "executing" reads as "thinking", a paused assistant says "paused". Every
 * change is mirrored to body[data-state] so CSS can colour the stage.
 */
function applyState(name) {
  curState = name;
  const ui = paused ? "paused" : labelFor(name);
  document.body.dataset.state = ui;
  stateEl.textContent = STATE_WORD[ui] || ui;
  renderCaptions();
}

function setState(name) {
  if (!STATES.includes(name)) name = "error";
  if (name === "muted" || name === "listening") lines = endTurn(lines);
  if (name !== "muted") prevState = name;
  applyState(name);
}

function caption(who, text) {
  lines = mergeCaption(lines, who, text);
  renderCaptions();
}

/* ---- mode: {"type":"mode"} names the brain in the status strip (SPEC E8) - */
function setMode(mode) {
  modeEl.classList.toggle("offline", mode === "offline");
  brainEl.textContent = mode === "offline" ? "Offline" : "Gemini Live";
}

/* ---- assistant pause (M13): {"type":"paused","minutes":m} ------------------
 * While paused the mic keeps running locally but NOT ONE frame is sent to
 * the server (dropped in the worklet handler); the Resume button brings 7
 * back early, otherwise listening restarts by itself after <minutes>.
 */
function setPaused(minutes) {
  paused = true;
  if (pauseTimer) { clearTimeout(pauseTimer); pauseTimer = null; }
  const mins = Math.max(1, Number(minutes) || 1);
  resumeBtn.textContent = "Resume listening (paused " + mins + " min)";
  resumeBtn.classList.add("on");
  caption("seven", "Paused for " + mins + " minute" + (mins === 1 ? "" : "s") +
        " — tap Resume or I will come back on my own.");
  applyState(curState);
  pauseTimer = setTimeout(resumeListening, mins * 60 * 1000);
}

function resumeListening() {
  if (pauseTimer) { clearTimeout(pauseTimer); pauseTimer = null; }
  if (!paused) return;
  paused = false;
  resumeBtn.classList.remove("on");
  setState(muted ? "muted" : "listening");
  caption("seven", "Listening again.");
}

resumeBtn.addEventListener("click", resumeListening);

function renderCaptions() {
  captionsEl.textContent = "";
  for (const l of lines.slice(-60)) {
    const div = document.createElement("div");
    div.className = "line " + (l.who === "you" ? "you" : "seven");
    const tag = document.createElement("span");
    tag.className = "who";
    tag.textContent = l.who === "you" ? "You" : "7";
    div.appendChild(tag);
    div.appendChild(document.createTextNode(l.text));
    captionsEl.appendChild(div);
  }
  captionsEl.scrollTop = captionsEl.scrollHeight;   // newest at the bottom
}

/* ---- approval cards: Yes/No mirrors the spoken question (SPEC E7) -------- */
function showApproval(ev) {
  closeApproval(ev.action_id);               // one card per action_id
  const card = document.createElement("div");
  card.className = "approval-card";
  card.dataset.actionId = ev.action_id;
  const title = document.createElement("div");
  title.className = "a-title";
  title.textContent = "7 asks: " + ev.tool;

  risk.textContent = ev.risk + " risk";
